syntax = "proto3";

option csharp_namespace = "Gateway.Grpc";

package preprocessing;

service DataPreprocessor {
  rpc ProcessData (ProcessRequest) returns (ProcessReply);
}

message ProcessRequest {
  string raw_payload = 1;
  string payload_format = 2;
}

message ProcessReply {
  bool is_valid = 1;
  string sensor_id = 2;
  string data_type = 3;
  double processed_value = 4;
  string processed_date = 5;
  string data_time = 6;
  string zone = 7;
}
